name: Deploy

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Créer .env.prod
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORYBLOK_TOKEN: ${{ secrets.STORYBLOK_TOKEN }}
          STORYBLOK_WEBHOOK_SECRET: ${{ secrets.STORYBLOK_WEBHOOK_SECRET }}
        run: |
          printf "SUPABASE_URL=%s\n" "$SUPABASE_URL" > .env.prod
          printf "SUPABASE_KEY=%s\n" "$SUPABASE_KEY" >> .env.prod
          printf "SUPABASE_SERVICE_ROLE_KEY=%s\n" "$SUPABASE_SERVICE_ROLE_KEY" >> .env.prod
          printf "STORYBLOK_TOKEN=%s\n" "$STORYBLOK_TOKEN" >> .env.prod
          printf "STORYBLOK_VERSION=published\n" >> .env.prod
          printf "STORYBLOK_REGION=eu\n" >> .env.prod
          printf "STORYBLOK_WEBHOOK_SECRET=%s\n" "$STORYBLOK_WEBHOOK_SECRET" >> .env.prod
          printf "NODE_ENV=production\n" >> .env.prod

      - name: Build et déploiement
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d

      - name: Nettoyage
        if: always()
        run: |
          rm -f .env.prod
          docker image prune -f
